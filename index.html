<!DOCTYPE html>
<html lang="zh-Hant">
<head>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link rel="stylesheet" href="css/style.css">

<body>
    <header class="nav">
        <div class="logo">ZIYI<span>.</span></div>

    <main>
        <section id="home" class="hero-sec">
            <p class="hero-hi">你好, 我是</p>

                <a href="#works" class="btn">我的作品</a>
                <a href="#contact" class=" btn ghost-btn">聯絡我</a>
            </div>

        <section id="about" class="section">
            <h2 class="section-title">關於我</h2>
            <p class="section-sub">About Me</p>
            <div class="about-box">

            </div>

        <section id="skills" class="section">

            <p class="section-sub">skills</p>

            <div class="skill-grid">
                <div class="skill-card">
                    <div class="skill-icon"><i class="fa-solid fa-code"></i></div>

                    <p>作出網頁骨架</p>
                    <div class="skill-bar">
                        <div class="skill-bar-html" style="width: 65%;"></div>

                </div>

                    <div class="skill-icon"><i class="fa-solid fa-palette"></i></div>

                    <p>排版與設計</p>
                    <div class="skill-bar">
                        <div class="skill-bar-css" style="width: 55%;"></div>
                    </div>
                </div>
                <div class="skill-card">
                    <div class="skill-icon"><i class="fa-brands fa-node-js"></i></div>
                    <h3>JavaScript</h3>
                    <p>響應式設計</p>
                    <div class="skill-bar">
                        <div class="skill-bar-javasript" style="width: 30%;"></div>
                    </div>

        <section id="works">
            <h2>作品展示</h2>

        <section id="contact">
            <h2>聯絡我</h2>
        </section>
